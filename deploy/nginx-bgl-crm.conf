# ═══════════════════════════════════════════════════════════════
#  BGL CRM — nginx reverse proxy template (v2.29.0)
#
#  PURPOSE
#    Puts the standalone Node server (127.0.0.1:3000) behind a
#    proper domain with HTTPS. Copy to /etc/nginx/sites-available/
#    and replace THREE placeholders:
#       1. crm.example.com        → your domain
#       2. /etc/letsencrypt/live/crm.example.com/fullchain.pem
#          /etc/letsencrypt/live/crm.example.com/privkey.pem
#          (created automatically by certbot --nginx — see
#          DEPLOYMENT.md step 6; until then keep only the HTTP
#          block active)
#       3. /opt/bgl-crm           → your install path (only in
#          the optional static-serving block, if you enable it)
#
#  WHY EACH DIRECTIVE MATTERS (do not delete blindly):
#    client_max_body_size 75m — the app enforces its own caps
#      (10 MB file uploads, telephony audio up to 60 MB) but
#      nginx REJECTS larger bodies with 413 before the app ever
#      sees them. 75m covers the maximum audio cap + JSON/meta
#      overhead.
#    X-Forwarded-For $remote_addr — CRITICAL, overwrites the
#      header with the DIRECT PEER IP instead of appending.
#      The app's rate limiter takes the FIRST XFF entry; with
#      the common "$proxy_add_x_forwarded_for" recipe a client
#      could spoof that first entry and bypass login throttling.
#      Overwriting is correct here because nginx is the only
#      peer allowed to reach Node (bind 127.0.0.1 + firewall).
#    X-Forwarded-Proto — lets the app know TLS terminated at
#      the proxy; keeps future absolute-URL logic honest.
#    X-Forwarded-Host — v2.31.1: the app's CSRF layer accepts the
#      original host from this header when a proxy chain rewrites
#      Host on a later hop. Overwrite semantics, like XFF above: a
#      client must not be able to inject its own value.
#      (With this template Host is preserved anyway — the header is
#      belt-and-braces for chained setups.)
#    proxy_http_version 1.1 + Upgrade/Connection — clean
#      keepalive upstream, no websocket headers broken.
# ═══════════════════════════════════════════════════════════════

# ── HTTP: redirect everything to HTTPS (keep ACME renewal path open) ──
server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # Let's Encrypt renewal challenge must stay reachable over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the actual proxy ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.example.com;

    # Certificates (created by certbot — DEPLOYMENT.md step 6)
    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    # TLS hardening (Mozilla intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — only enable AFTER https is confirmed working, and only
    # if you will keep HTTPS forever (browsers remember it).
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Body cap — see header comment for the sizing rationale.
    client_max_body_size 75m;

    # Timeouts aligned with the app's own 10s external-connection cap
    # (AI bridge test) and slow JSON exports.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # SECURITY: overwrite (not append) — see header comment.
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host             $host;

        # Keepalive-safe hop-by-hop headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer request bodies so a slow client can't hold an upstream
        # connection hostage (file uploads are small and local).
        proxy_request_buffering on;
    }

    # OPTIONAL performance block: serve immutable build chunks and
    # public files straight from disk instead of through Node.
    # Enable only if /opt/bgl-crm matches your install path.
    # location /_next/static/ {
    #     alias /opt/bgl-crm/.next/standalone/.next/static/;
    #     expires 365d;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }
    # location /favicon.ico {
    #     alias /opt/bgl-crm/.next/standalone/public/favicon.ico;
    #     expires 7d;
    #     access_log off;
    # }

    access_log /var/log/nginx/bgl-crm.access.log;
    error_log  /var/log/nginx/bgl-crm.error.log;
}
